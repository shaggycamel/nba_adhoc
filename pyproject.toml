[project]
name = "nba-adhoc"
version = "0.1.0"
description = "Ad hoc NBA data analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
export = [
    "psycopg[binary]>=3.3.6",
    "sports-hub",
]

[tool.uv.sources]
sports-hub = { git = "https://github.com/shaggycamel/sports-hub.git" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "nba-adhoc"
version = "0.1.0"
description = "Ad hoc NBA analysis: predicting player usage for the next game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
export = [
    "psycopg[binary]>=3.3.6",
    "sports-hub",
]

[tool.uv.sources]
sports-hub = { git = "https://github.com/shaggycamel/sports-hub.git" }

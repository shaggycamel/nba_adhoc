[project]
name = "nba-adhoc"
version = "0.1.0"
description = "Ad hoc NBA data analysis: predicting player usage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
# `sports-hub` is only needed by data/gen.py, which re-dumps the parquet files
# straight from postgres. It can't run in a cloud session (SQL port blocked), so
# it's left out of the lock; add it back here with the source below when needed.
export = [
    "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
sports-hub = { git = "https://github.com/shaggycamel/sports-hub.git" }
